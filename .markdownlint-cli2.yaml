# Markdown this repo owns. The README is the first thing a new project's
# author reads off this template, and a broken link or a skipped heading level
# is exactly the sort of thing nobody notices while writing it.
globs:
  - "**/*.md"

ignores:
  - CHANGELOG.md # written by the release job, not by hand
  - "**/node_modules/**"
  - "**/.bun-cache/**"
  # Vale's style packages, downloaded by `vale sync`. Somebody else's docs,
  # held to somebody else's rules.
  - "styles/Google/**"
  - "styles/proselint/**"
  # Generated by `openspec init`/`openspec update`, not written by hand.
  # Same reasoning as Vale's style packages above.
  - ".claude/commands/**"
  - ".claude/skills/**"

config:
  # markdownlint/style/prettier drops MD013 because Prettier reflows prose on
  # proseWrap "always"/"never" — this repo runs "preserve", so Prettier never
  # moves a line break and the check is still worth having. Re-enabled under
  # its alias, never under MD013, or the inherited `line-length: false` wins.
  line-length:
    line_length: 80
    tables: false
    code_blocks: false

# OpenSpec's own artifact templates (proposal.md, spec.md, tasks.md, design.md)
# open with an H2 ("## Purpose", "## Why", ...) by the tool's own convention,
# not a missing title. MD041 would otherwise fight every `openspec new`
# straight out of the box.
overrides:
  - filter:
      - "openspec/changes/**/*.md"
      - "openspec/specs/**/*.md"
    combine: merge
    config:
      MD041: false

extends: "markdownlint/style/prettier"
