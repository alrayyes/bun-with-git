# Dependabot raises the pull request; CI decides whether it lands. Everything
# here is pinned to an exact version, which is the whole reason this works —
# a floating range drifts silently and there's nothing to raise a pull
# request about.
#
# Two pins Dependabot can't see, and which are updated by hand: the Vale
# version in prose.yml/CONTRIBUTING.md and the hadolint version in
# compose.yaml. Neither lives anywhere Dependabot's ecosystems look.
version: 2

updates:
  # The only ecosystem that changes what this repo ships: a base image bump
  # is a change to the published artefact, so it gets fix:, not chore: —
  # the same reasoning the release workflow's header comment gives for
  # treating a base image patch as release-worthy.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: fix
      include: scope

  # Dev tooling only — the linter and its dependencies never end up in the
  # image, so a bump here is housekeeping, not a change to what ships.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      bun-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
