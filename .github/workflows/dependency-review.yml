# Catches a pull request introducing a dependency that's already
# known-bad, checked at merge time rather than waiting for Dependabot's
# next scheduled scan. rules/releases.md skips this on a private,
# personal-owned repo — GHAS doesn't run there without an org licence —
# but bun-with-git is public, so the exception doesn't hold here.
name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
