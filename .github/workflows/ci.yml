# The gate. Every command in here has a twin in lefthook.yml, so a green
# pre-commit means a green pipeline and neither can drift into being the only
# place a rule is enforced.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. A job that needs more says so itself.
permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        # Frozen, so a drifted lockfile fails the job rather than silently
        # resolving to something nobody committed.
        run: bun install --frozen-lockfile
      - name: biome check
        run: bun run lint
      - name: sort-package-json --check
        run: bun run sort-package-json:check

  # Works out whether a pull request touched what the audit reads. A skipped job reports
  # success, so branch protection can still require the audit; a `paths:` filter on the
  # workflow would leave it pending forever. A push to main always audits.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deps: ${{ steps.groups.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: groups
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          deps=true
          if [ "${EVENT}" = pull_request ]; then
            # Captured first so a failed diff (missing base SHA) stops the step under `bash -e`
            # instead of reading as "nothing changed".
            files=$(git diff --name-only "${BASE}...HEAD")
            if ! grep -Eq '^(package\.json|bun\.lock|\.github/workflows/ci\.yml)$' <<<"${files}"; then
              deps=false
            fi
          fi
          echo "deps=${deps}" >> "$GITHUB_OUTPUT"

  # Fails only on advisories this change adds to bun.lock over its base (rules/dependencies.md).
  # What is already on main is the scan's to track, in advisory-scan.yml. bun audit reads the
  # lockfile, so neither side needs an install.
  audit:
    needs: changes
    # Runs when the changes job failed too: a gate that can't tell what changed must not skip.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.deps == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Pinned to a main commit of alrayyes/advisory-scan until its first release; re-pin then.
      - uses: alrayyes/advisory-scan@425418a63e80eb10142fbd2e82127b7ef3a51d68
        with:
          mode: gate
          command: bun audit

  dockerfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # --pull so a base image already on the runner can't make a broken FROM
      # line look fine. Build only — the tag dies with the runner.
      - run: docker build --pull -t bun-with-git:ci .

      # The image exists to carry these. If Alpine renames a package or drops
      # it from the branch, `apk add` still succeeds for the rest and the
      # build stays green — the failure surfaces in someone else's checkout
      # step instead. So assert it here, where it's this repo's problem.
      - name: Check the image carries what a checkout job needs
        run: |
          docker run --rm bun-with-git:ci sh -c '
            set -eu
            for c in bun node git; do
              command -v "$c" >/dev/null || { echo "missing: $c"; exit 1; }
            done
            [ -d /etc/ssl/certs ] || { echo "no CA store"; exit 1; }
            git ls-remote https://github.com/alrayyes/bun-with-git >/dev/null
          '

  # Layout and structure. Style and mechanics are prose.yml — see its header
  # comment for why they're split out.
  prose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        run: bun install --frozen-lockfile
      - name: prettier --check
        run: bun run format:check
      - name: markdownlint
        run: bun run lint:md

  # A hook is something you can skip, and the version number depends on
  # these messages being right, so the whole branch is checked here too.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: commitlint
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
