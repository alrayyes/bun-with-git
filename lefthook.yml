# The same commands CI runs, so the two cannot drift. The hook catches it
# early; CI is the gate that cannot be skipped.
#
# Grows a job here the same PR that adds the tool it runs — a linter with no
# hook is a linter you only meet at CI.

# pre-commit may write. Let every fixer run and restage what it touched — a
# commit should not fail over a quote style a tool can settle by itself.
pre-commit:
  jobs:
    - name: biome
      glob: "*.{json,jsonc}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # Prettier decides the layout, markdownlint then judges what Prettier
    # produced. The other order has markdownlint fixing something Prettier is
    # about to overwrite.
    - name: prettier
      glob: "*.{md,yml,yaml}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "*.md"
      run: bunx markdownlint-cli2 {staged_files}

    - name: sort-package-json
      glob: "package.json"
      run: bunx sort-package-json {staged_files}
      stage_fixed: true

    - name: hadolint
      glob: "Dockerfile"
      run: docker run --rm -v "$PWD:/app" -w /app hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552 hadolint --config .hadolint.yaml {staged_files}

    # Hadolint reads the Dockerfile as text; this proves it still builds.
    # Tagged and removed so a commit doesn't leave an untagged image behind.
    - name: docker build
      glob: "Dockerfile"
      run: docker build -t bun-with-git:pre-commit-check . && docker rmi bun-with-git:pre-commit-check

    # Fast enough for a commit. LTeX is not — around ten seconds a file — so
    # mechanics run at push instead, where the wait is paid once rather than
    # per commit.
    #
    # --minAlertLevel=error, matching pre-push and CI's lint:prose script:
    # errors are the tier worth failing a commit over, and style advice
    # that blocks one teaches people to skip the hook.
    - name: vale
      glob: "*.md"
      exclude:
        - "CHANGELOG.md"
        # Generated by `openspec init`/`openspec update`, not written by
        # hand. Vale has no config-level path ignore the way markdownlint
        # and Prettier do, so this has to be excluded here too.
        - ".claude/commands/**"
        - ".claude/skills/**"
      run: vale --minAlertLevel=error {staged_files}

commit-msg:
  jobs:
    # Resolved from node_modules rather than fetched by bunx: commitlint has to
    # load the config its own config extends, and bunx cannot resolve a sibling
    # package for it. Run `bun install` if this cannot find itself.
    - name: commitlint
      run: bunx commitlint --edit {1}

# pre-push never writes. A hook rewriting files under a push leaves the pushed
# commit and the working tree disagreeing about what was reviewed.
#
# Parallel because of that: nothing here touches a file, so no job can be
# reading what another is rewriting.
pre-push:
  parallel: true
  jobs:
    - name: biome
      run: bun run lint

    - name: hadolint
      run: docker run --rm -v "$PWD:/app" -w /app hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552 hadolint --config .hadolint.yaml Dockerfile

    # Unconditional, unlike pre-commit's glob-scoped copy: the check nothing
    # gets past regardless of what changed.
    - name: docker build
      run: docker build -t bun-with-git:pre-push-check . && docker rmi bun-with-git:pre-push-check

    # These are `package.json` scripts rather than the commands spelled out,
    # because CI runs the same ones and a literal copied into two files drifts
    # the first time somebody edits one of them.
    - name: prettier
      run: bun run format:check

    - name: markdownlint
      run: bun run lint:md

    - name: sort-package-json
      run: bun run sort-package-json:check

    - name: bun audit
      run: bun run audit

    # Every other linter here runs at commit, at push and in CI. Vale ran at
    # commit and then nothing until CI, because its invocation lived in the
    # workflow as a block of bash with nothing a hook could reuse. It is a
    # script now, and this is the whole-tree run that was missing.
    - name: vale
      run: bun run lint:prose

    # Grammar and spelling. Left out of pre-commit on the grounds that it is a
    # ~300 MB download, which it is — but it caches outside the repository and
    # then costs about ten seconds.
    - name: mechanics
      run: bun run lint:mechanics
